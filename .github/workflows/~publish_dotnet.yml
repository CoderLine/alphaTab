on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      force:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: 
          fetch-depth: 100      
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8"

      - run: npm run update-version -- ${{inputs.version}}
      - run: npm ci -w packages/alphatab -w packages/transpiler -w packages/tooling -w packages/csharp --include-workspace-root
      - run: npm run build-csharp

      - run: npm run nightly-pack -- --platform dotnet --force ${{ inputs.force }}
      # nuget.org trusted publishing: the policy matches this file (job_workflow_ref), not the calling workflow
      - uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: npm run nightly-publish -- --platform dotnet --force ${{ inputs.force }} --dry-run ${{ inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
