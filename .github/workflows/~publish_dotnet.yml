on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      force:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: 
          fetch-depth: 100      
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8"

      - run: npm run update-version -- ${{inputs.version}}
      - run: npm ci
      - run: npm run build-csharp

      - run: npm run nightly-pack -- --platform dotnet --force ${{ inputs.force }}
      - run: npm run nightly-publish -- --platform dotnet --force ${{ inputs.force }} --dry-run ${{ inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
