on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      force:
        type: boolean
        default: false
      npm_tag:
        type: string
        required: true
      stage:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    outputs:
      published_versions:
        description: JSON object of the npm packages published by this run and their versions; {} on dry runs
        value: ${{ jobs.build.outputs.published_versions }}


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published_versions: ${{ steps.publish.outputs.published_versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - run: npm run update-version -- ${{inputs.version}}
      - run: >
          npm ci --include-workspace-root
          -w packages/alphatab -w packages/alphatex -w packages/transpiler -w packages/tooling
          -w packages/lsp -w packages/monaco -w packages/webpack -w packages/vite
      - run: npm run build-web
      - run: npm run build-language-server
      - run: npm run build-monaco

      - run: npm run nightly-pack -- --platform web --force ${{ inputs.force }}
      - run: npm install -g npm@11
      - id: publish
        run: npm run nightly-publish -- --platform web --force ${{ inputs.force }} --tag ${{ inputs.npm_tag }} --stage ${{ inputs.stage }} --dry-run ${{ inputs.dry_run }}
