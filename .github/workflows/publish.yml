name: Publish

on:
  workflow_dispatch:
    inputs:
      web:
        type: boolean
        description: Publish web packages
        default: true
      dotnet:
        type: boolean
        description: Publish .NET packages
        default: true
      kotlin:
        type: boolean
        description: Publish Kotlin packages
        default: true
      force:
        type: boolean
        description: Publish all web packages, not only the ones changed in the last 26 hours
        default: false
      dry_run:
        type: boolean
        description: Build and verify all packages without publishing them
        default: false

jobs:
  web:
    if: inputs.web
    uses: ./.github/workflows/~publish_web.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      version: alpha ${{github.run_number}}
      npm_tag: alpha
      force: ${{ inputs.force || inputs.dry_run }}
      dry_run: ${{ inputs.dry_run }}

  dotnet:
    if: inputs.dotnet
    uses: ./.github/workflows/~publish_dotnet.yml
    secrets: inherit
    with:
      version: alpha ${{github.run_number}}
      force: ${{ inputs.force || inputs.dry_run }}
      dry_run: ${{ inputs.dry_run }}

  kotlin:
    if: inputs.kotlin
    uses: ./.github/workflows/~publish_kotlin.yml
    secrets: inherit
    with:
      version: alpha ${{github.run_number}}
      force: ${{ inputs.force || inputs.dry_run }}
      dry_run: ${{ inputs.dry_run }}
