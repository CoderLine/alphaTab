name: Release
on: 
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_web:
        type: boolean
        description: Release web packages
        default: true
      release_csharp:
        type: boolean
        description: Release C# packages
        default: true
      release_kotlin_android:
        type: boolean
        description: Release Android packages
        default: true
      release_website:
        type: boolean
        description: Deploy the website (alphatab.net) after the web packages
        default: true
      dry_run:
        type: boolean
        description: Build and verify all selected packages without publishing them
        default: false

jobs:
  web:
    uses: ./.github/workflows/~publish_web.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_web == 'true')
    with: 
      version: ${{github.run_number}}
      npm_tag: latest
      force: true
      stage: true
      dry_run: ${{ inputs.dry_run == true }}

  dotnet:
    uses: ./.github/workflows/~publish_dotnet.yml
    secrets: inherit
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_csharp == 'true')
    with: 
      version: ${{github.run_number}}
      force: true
      dry_run: ${{ inputs.dry_run == true }}

  kotlin:
    uses: ./.github/workflows/~publish_kotlin.yml
    secrets: inherit
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_kotlin_android == 'true')
    with:
      version: ${{github.run_number}}
      force: true
      dry_run: ${{ inputs.dry_run == true }}

  website:
    needs: web
    # inputs are null on tag pushes
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.release_website) && (needs.web.result == 'success' || needs.web.result == 'skipped') }}
    uses: ./.github/workflows/~publish_website.yml
    permissions:
      contents: read
    with:
      channel: stable
      npm_tag: latest
      deploy_branch: main
      expected_versions: ${{ needs.web.outputs.published_versions }}
      dry_run: ${{ inputs.dry_run == true }}
